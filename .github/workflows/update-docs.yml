name: 🗺️ Auto-Update Mindmap & README

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - master
    # Re-generate whenever source files change; skip if only docs changed
    paths-ignore:
      - "mindmap.md"
      - "README.md"
      - ".github/**"
      - "**/*.md"
      - "scripts/update-mindmap.js"

# Only one run at a time per branch (cancel in-progress if a new push arrives)
concurrency:
  group: update-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    name: Regenerate mindmap.md & README.md
    runs-on: ubuntu-latest

    # Required so the job can push back to the repo
    permissions:
      contents: write

    steps:
      # ── 1. Checkout full history so git log works ─────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Node.js (script uses only built-ins, but still useful) ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 3. Run the mindmap updater ────────────────────────────────────────
      - name: Run update-mindmap script
        run: node scripts/update-mindmap.js
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # ── 4. Commit & push only if the files actually changed ───────────────
      - name: Commit updated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mindmap.md README.md
          # Exit 0 even when nothing changed (diff returns 1 when files differ)
          git diff --staged --quiet && echo "No changes — skipping commit" && exit 0
          git commit -m "docs: auto-update mindmap & README [skip ci]

          Triggered by commit ${{ github.sha }} on ${{ github.ref_name }}
          Author: ${{ github.actor }}"
          git push
